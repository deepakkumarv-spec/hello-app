name: Hello GitOps Pipeline

on:
  push:
    branches:
      - main

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: kumarvdeepak/deepak:${{ github.run_number }}

      - name: Checkout GitOps Repository
        uses: actions/checkout@v4
        with:
          repository: deepakkumarv-spec/gitops-repo
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops

      - name: Update Image Tag
        run: |
          sed -i 's/tag:.*/tag: "${{ github.run_number }}"/' gitops/apps/hello-chart/values.yaml

      - name: Verify Updated values.yaml
        run: |
          cat gitops/apps/hello-chart/values.yaml

      - name: Configure Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

      - name: Commit Changes
        run: |
          cd gitops

          git add .

          git status

          git commit -m "Update image to ${{ github.run_number }}" || echo "Nothing to commit"

      - name: Push GitOps Repository
        run: |
          cd gitops
          git push origin master
